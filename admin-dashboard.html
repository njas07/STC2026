<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin / Panitia Dashboard - STC 2026</title>
    <link rel="stylesheet" href="desain/dashboard.css">
</head>
<body>
<div class="dashboard-layout">

    <!-- SIDEBAR -->
    <aside class="dash-side">
        <img src="foto/Logo STC.svg" alt="STC" class="logo">
        <div class="brand">STC 2026<small>Admin Panel</small></div>
        <nav class="side-nav">
            <a href="#pendaftaran" class="active" data-tab="pendaftaran">📋 Pendaftaran</a>
            <a href="#announcement" data-tab="announcement">📢 Announcement</a>
        </nav>
        <div class="side-user">
            <div class="avatar" id="avatarIni">A</div>
            <p id="sideName">Admin</p>
            <span id="sideEmail">-</span>
        </div>
    </aside>

    <!-- MAIN -->
    <main class="dash-main">
        <div class="dash-topbar">
            <h2>Admin / Panitia Dashboard<small>Kelola pendaftaran & pengumuman</small></h2>
            <button class="btn-logout" onclick="logout()">Logout</button>
        </div>

        <!-- ============ TAB PENDAFTARAN ============ -->
        <section id="tab-pendaftaran" class="tab-panel">
            <div class="card">
                <h3>Daftar Seluruh Pendaftar</h3>
                <div class="toolbar">
                    <input type="text" id="searchInput" placeholder="Cari nama / kode..." oninput="loadRegistrations()">
                    <select id="filterCompetition" onchange="loadRegistrations()">
                        <option value="">Semua Lomba</option>
                        <option value="web_design">Web Design</option>
                        <option value="infografis">Infografis</option>
                        <option value="excel">Microsoft Excel</option>
                        <option value="speed_typing">Speed Typing</option>
                        <option value="mobile_legends">Mobile Legends</option>
                        <option value="free_fire">Free Fire</option>
                        <option value="cerdas_cermat">Cerdas Cermat</option>
                    </select>
                    <select id="filterStatus" onchange="loadRegistrations()">
                        <option value="">Semua Status</option>
                        <option value="PENDING">PENDING</option>
                        <option value="VERIFIED">VERIFIED</option>
                        <option value="REJECTED">REJECTED</option>
                        <option value="PAID">PAID</option>
                    </select>
                </div>
                <div class="table-wrap">
                    <table>
                        <thead>
                            <tr>
                                <th>Kode</th>
                                <th>Nama</th>
                                <th>Lomba</th>
                                <th>Sekolah</th>
                                <th>Status</th>
                                <th>Aksi</th>
                            </tr>
                        </thead>
                        <tbody id="regTableBody">
                            <tr><td colspan="6" class="empty">Memuat data...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </section>

        <!-- ============ TAB ANNOUNCEMENT ============ -->
        <section id="tab-announcement" class="tab-panel" style="display:none;">
            <div class="card admin-form">
                <h3>Tambah / Edit Announcement</h3>
                <form id="annForm">
                    <input type="hidden" name="id" id="annId">
                    <div class="form-grid">
                        <div class="form-group full">
                            <label>Judul <span>*</span></label>
                            <input type="text" name="title" id="annTitle" placeholder="Judul pengumuman" required>
                        </div>
                        <div class="form-group full">
                            <label>Gambar (opsional)</label>
                            <input type="file" name="image" id="annImage" accept="image/*">
                        </div>
                        <div class="form-group full">
                            <label>Isi Pengumuman</label>
                            <textarea name="content" id="annContent" placeholder="Isi pengumuman..."></textarea>
                        </div>
                        <div class="form-group full">
                            <label>Status</label>
                            <select name="status" id="annStatus">
                                <option value="draft">Draft</option>
                                <option value="published">Publish</option>
                            </select>
                        </div>
                    </div>
                    <button type="submit" class="btn-primary" style="margin-top:16px;">Simpan Announcement ☁</button>
                </form>
            </div>

            <div class="card">
                <h3>Daftar Pengumuman</h3>
                <div class="ann-list" id="annList">
                    <div class="empty">Memuat pengumuman...</div>
                </div>
            </div>
        </section>
    </main>
</div>

<!-- ============ MODAL DETAIL PENDAFTARAN ============ -->
<div class="modal" id="detailModal">
    <div class="modal-content">
        <button class="modal-close" onclick="closeModal('detailModal')">✕</button>
        <h3>Detail Pendaftar</h3>
        <div id="detailBody"></div>
        <div id="rejectNote" class="reject-note"></div>
        <div style="margin-top:20px;display:flex;gap:10px;flex-wrap:wrap;">
            <button class="btn btn-verify" onclick="verifyReg('verify')">✔ Verifikasi</button>
            <button class="btn btn-verify" onclick="verifyReg('paid')">💰 Tandai Bayar</button>
            <button class="btn btn-reject" onclick="promptReject()">✖ Tolak</button>
        </div>
    </div>
</div>

<script src="JavaScript/admin-dashboard.js"></script>
</body>
</html>
