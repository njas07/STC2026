<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - STC 2026</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <!-- CSS Global -->
    <link rel="stylesheet" href="../desain/global.css">

    <!-- CSS Login -->
    <link rel="stylesheet" href="../desain/auth/login.css">
</head>

<body>

    <!--==================== LOGIN ====================-->

    <main class="auth-page">

        <div class="auth-container">

            <!-- Logo -->
            <div class="auth-logo">
                <img
                    src="../foto/LOGOSTC.png"
                    alt="STC 2026" decoding="async">
            </div>

            <!-- Header -->
            <div class="auth-header">
                <span class="auth-kicker">WELCOME BACK</span>

                <h1>Login</h1>

                <p>
                    Masuk ke akun STC 2026 kamu
                </p>
            </div>

            <!-- Alert -->
            <div
                id="alertBox"
                class="alert"
                role="alert"
            ></div>

            <!-- Login Form -->
            <form
                id="loginForm"
                novalidate
            >

                <!-- Email -->
                <div class="form-group">

                    <label for="email">
                        Email <span>*</span>
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="contoh@email.com"
                        autocomplete="email"
                        required
                    >

                </div>

                <!-- Password -->
                <div class="form-group">

                    <label for="password">
                        Password <span>*</span>
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Password kamu"
                        autocomplete="current-password"
                        required
                    >

                </div>

                <!-- Login Button -->
                <button
                    type="submit"
                    class="btn-auth"
                >
                    Login ☁
                </button>

            </form>

            <!-- Register -->
            <p class="auth-switch">
                Belum punya akun?
                <a href="Register.html">
                    Daftar disini
                </a>
            </p>

            <!-- Back Home -->
            <a
                href="../index.html"
                class="back-home"
            >
                ← Kembali ke Beranda
            </a>

        </div>

    </main>


    <!--==================== JAVASCRIPT ====================-->

    <script src="../JavaScript/login.js"></script>

</body>
</html>
