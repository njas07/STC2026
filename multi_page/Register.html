<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Akun - STC 2026</title>
    <link rel="stylesheet" href="../desain/login.css">
</head>
<body>

<div class="auth-sky">
    <div class="sun"></div>
    <div class="auth-cloud auth-cloud--1"></div>
    <div class="auth-cloud auth-cloud--2"></div>
    <div class="auth-cloud auth-cloud--3"></div>
</div>

<div class="auth-wrap">
    <div class="auth-card wide">
        <img src="../foto/Logo STC.svg" alt="STC" class="auth-logo">
        <h1>DAFTAR AKUN</h1>
        <p class="auth-sub">Buat akun untuk mendaftar lomba STC 2026</p>

        <div id="alertBox" class="alert"></div>

        <form id="registerForm" novalidate>
            <div class="form-group">
                <label>Nama Lengkap <span>*</span></label>
                <input type="text" name="name" placeholder="Nama lengkap kamu" required>
            </div>
            <div class="form-group">
                <label>Email <span>*</span></label>
                <input type="email" name="email" placeholder="contoh@email.com" required>
            </div>
            <div class="form-group">
                <label>Nomor WhatsApp <span>*</span></label>
                <input type="tel" name="phone" placeholder="08xxxxxxxxxx" required>
            </div>
            <div class="form-group">
                <label>Password <span>*</span></label>
                <input type="password" name="password" placeholder="Minimal 6 karakter" required>
            </div>
            <div class="form-group">
                <label>Konfirmasi Password <span>*</span></label>
                <input type="password" name="confirm_password" placeholder="Ulangi password" required>
            </div>

            <button type="submit" class="btn-auth">Daftar ☁</button>
        </form>

        <p class="auth-switch">Sudah punya akun? <a href="Login.html">Login disini</a></p>
        <a href="../Landing_page/Index.html" class="back-home">← Kembali ke Beranda</a>
    </div>
</div>

<script src="../JavaScript/register.js"></script>
</body>
</html>
