<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Daftar - STC 2026</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- CSS Global -->
    <link rel="stylesheet" href="../desain/global.css" />

    <!-- CSS Register -->
    <link rel="stylesheet" href="../desain/auth/register.css" />
  </head>

  <body>
    <!--==================== REGISTER ====================-->

    <main class="auth-page">
      <div class="auth-container">
        <!-- Logo -->
        <div class="auth-logo">
          <img src="/foto/LOGOSTC.png" alt="STC 2026" />
        </div>

        <!-- Header -->
        <div class="auth-header">
          <span class="auth-kicker"> JOIN STC 2026 </span>

          <h1>Daftar</h1>

          <p>Buat akun untuk mengikuti STC 2026</p>
        </div>

        <!-- Alert -->
        <div id="alertBox" class="alert" role="alert"></div>

        <!-- Register Form -->
        <form id="registerForm" novalidate>
          <!-- Nama Lengkap -->
          <div class="form-group">
            <label for="name"> Nama Lengkap <span>*</span> </label>

            <input
              type="text"
              id="name"
              name="name"
              placeholder="Nama lengkap kamu"
              autocomplete="name"
              required
            />
          </div>

          <!-- Email -->
          <div class="form-group">
            <label for="email"> Email <span>*</span> </label>

            <input
              type="email"
              id="email"
              name="email"
              placeholder="contoh@email.com"
              autocomplete="email"
              required
            />
          </div>

          <!-- Nomor WhatsApp -->
          <div class="form-group">
            <label for="phone"> Nomor WhatsApp <span>*</span> </label>

            <input
              type="tel"
              id="phone"
              name="phone"
              placeholder="08xxxxxxxxxx"
              autocomplete="tel"
              required
            />
          </div>

          <!-- Password -->
          <div class="form-group">
            <label for="password"> Password <span>*</span> </label>

            <input
              type="password"
              id="password"
              name="password"
              placeholder="Minimal 6 karakter"
              autocomplete="new-password"
              required
              minlength="6"
            />
          </div>

          <!-- Konfirmasi Password -->
          <div class="form-group">
            <label for="confirm_password">
              Konfirmasi Password <span>*</span>
            </label>

            <input
              type="password"
              id="confirm_password"
              name="confirm_password"
              placeholder="Ulangi password"
              autocomplete="new-password"
              required
              minlength="6"
            />
          </div>

          <!-- Register Button -->
          <button type="submit" class="btn-auth">Daftar ☁</button>
        </form>

        <!-- Login -->
        <p class="auth-switch">
          Sudah punya akun?

          <a href="Login.html"> Login disini </a>
        </p>

        <!-- Back Home -->
        <a href="../Landing_page/Index.html" class="back-home">
          ← Kembali ke Beranda
        </a>
      </div>
    </main>

    <!--==================== JAVASCRIPT ====================-->

    <script src="../JavaScript/register.js"></script>
  </body>
</html>
